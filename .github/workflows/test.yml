name: test

# Corre la red de tests de dominio (dinero) y el typecheck en cada PR y en main.
# Vercel ya hace `next build`; esto agrega lo que Vercel NO corre: `pnpm test`.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

  mcp:
    # El servidor MCP es un paquete aparte con su propio lockfile (no está en el
    # workspace de pnpm, igual que wa-sender/). Opera dinero real, así que la red
    # de CI también lo cubre.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # build ANTES de test: el handshake de protocol.test.ts arranca dist/index.js.
      - run: pnpm build
      - run: pnpm test
